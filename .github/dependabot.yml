version: 2
updates:
  # GitHub Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Go module dependencies (currently just the CLI framework).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      go:
        patterns: ["*"]

  # Build-time tools (staticcheck, govulncheck, misspell) live in their own
  # module so their newer toolchain requirements stay out of the main 1.23
  # graph; this entry lets dependabot see and bump them.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      tools:
        patterns: ["*"]
